<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>D&amp;C 펫</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/pets.css">
<style>
/* 데스크톱 펫 — 배경은 완전히 투명하고, 그림(SVG)과 말풍선 위에서만 마우스가 반응한다. */
html,body{margin:0;background:transparent;overflow:hidden;font:13px/1.45 "Segoe UI","Malgun Gothic",sans-serif;
  user-select:none;-webkit-user-select:none}
#stage{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;align-items:flex-end;padding:0 4px 4px}
.slot{position:relative;width:176px;display:flex;flex-direction:column;align-items:center}
.slot.off{display:none}
.pet{position:relative;width:176px}
.pet .art svg{display:block;width:176px;height:auto;overflow:visible;filter:drop-shadow(0 8px 8px rgba(90,60,140,.28));cursor:grab}
body.dragging .pet .art svg{cursor:grabbing}
.bubble{position:absolute;left:50%;bottom:calc(100% - 6px);transform:translate(-50%,6px) scale(.9);max-width:230px;width:max-content;
  background:#fff;color:#2f2b45;border:1.5px solid #e4dcfb;border-radius:16px;padding:6px 12px;box-shadow:0 6px 18px rgba(110,90,170,.25);text-align:center;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .35s cubic-bezier(.3,1.6,.5,1);z-index:2}
.bubble::after{content:"";position:absolute;left:50%;bottom:-5px;width:11px;height:11px;background:#fff;transform:translateX(-50%) rotate(45deg);border-radius:2px}
.bubble.show{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
.bubble small{display:block;font-size:11px;color:#7a6f63;margin-top:1px}
/* 쪽지(말풍선) — 한 번에 하나, 펫 위 가운데. 누르면 그 화면을 연다 */
.note{position:fixed;left:50%;top:6px;transform:translate(-50%,-4px);max-width:min(300px,calc(100vw - 12px));width:max-content;z-index:3;
  background:#fffaf2;color:#2b2723;border:1px solid #8c8276;border-radius:3px;padding:6px 12px 5px;box-shadow:0 2px 6px rgba(60,40,20,.18);
  opacity:0;pointer-events:none;transition:opacity .3s,transform .3s ease-out;cursor:pointer;line-height:1.4}
.note.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.note small{display:block;font-size:10.5px;color:#8c8276;margin-top:1px}
body.noting .bubble{opacity:0!important;pointer-events:none!important}
.pet.hop .bodywrap{animation:jump .5s ease-in-out 1!important}
.pet.hop .skin-media{animation:jump .5s ease-in-out 1!important}
.skin-media{cursor:grab}
</style>
</head>
<body>
<div class="note" id="note" role="status"><span></span><small>눌러서 열기</small></div>
<div id="stage">
  <div class="slot" id="slotDog">
    <div class="bubble" id="dogBubble"></div>
    <div class="pet dog" id="dog" data-mood="sleep" data-bark="off"><div class="art" id="dogArt"></div></div>
  </div>
  <div class="slot" id="slotCat">
    <div class="bubble" id="catBubble"></div>
    <div class="pet cat" id="cat" data-mood="idle"><div class="art" id="catArt"></div></div>
  </div>
</div>
<script src="/static/petwarp.js"></script>
<script src="/static/pets.js"></script>
<script>
const $ = s => document.querySelector(s);
const TOKEN = '__TOKEN__';
const api = window.petApi || null;                       // Electron 안에서만 있다(브라우저로 열면 미리보기 전용)
const params = new URLSearchParams(location.search);     // ?dog=sleep&cat=work&motion=mail 로 모습을 미리 볼 수 있다
let macros = [], connected = false;
const flash = PetMood.newFlash();

$('#catArt').innerHTML = PetArt.badge;                   // 그림은 스킨(기본 plush)이 그린다

/* ---------- 말풍선: 말이 바뀔 때와 마우스를 올릴 때만 잠깐 보인다 ---------- */
const bubbles = {dog: {el: $('#dogBubble'), text: '', timer: 0}, cat: {el: $('#catBubble'), text: '', timer: 0}};
function say(k, text, ms, sub) {                         // sub: 아래 작은 줄(레벨·간식)
  const b = bubbles[k];
  b.el.textContent = text;
  if (sub) { const s = document.createElement('small'); s.textContent = sub; b.el.append(s); }
  b.el.classList.add('show');
  clearTimeout(b.timer); b.timer = setTimeout(() => b.el.classList.remove('show'), ms || 5000);
}
function track(k, text) { const b = bubbles[k]; if (b.text !== text) { b.text = text; say(k, text, 5200); } }

function update() {
  const r = PetMood.compute(macros, flash, Date.now(), {dog: params.get('dog'), cat: params.get('cat'), motion: params.get('motion')});
  let dog = r.dog, dogText = r.dogText;
  if (!connected) { dog = 'sleep'; dogText = '허브에 연결 중…'; }
  const D = $('#dog'), C = $('#cat');
  D.dataset.mood = dog; D.dataset.bark = r.barking ? 'on' : 'off'; C.dataset.mood = r.cat; C.dataset.motion = r.catMotion || '';
  const pd = petting === 'dog' ? PetSkin.petted('dog', dog, r.barking) : {mood: dog, bark: r.barking};
  const pc = petting === 'cat' ? PetSkin.petted('cat', r.cat, false) : {mood: r.cat, bark: false};
  D.classList.toggle('petting', petting === 'dog'); C.classList.toggle('petting', petting === 'cat');
  renderSkin('dog', pd.mood, pd.bark); renderSkin('cat', pc.mood, false, r.catMotion);
  track('dog', dogText); track('cat', r.catText);
}

/* ---------- 스킨: 움직이는 이미지/영상으로 통째로 바꾸기 (web/skins/README.md) ---------- */
let skin = null, skinId = null;
let skinKey = null;                                      // 스킨 + 품종 — 바뀐 경우에만 다시 읽는다
async function setSkin(id, breed) { skinId = id; skinKey = JSON.stringify([id || null, breed || {}]); skin = await PetSkin.load(id, breed); PetSkin.reset($('#dogArt')); PetSkin.reset($('#catArt')); update(); }
const skinChanged = j => JSON.stringify([j.skin || null, j.breed || {}]) !== skinKey;
// 그리기는 허브 화면과 같은 PetSkin.render — 상태·소품(PetAcc)이 바뀔 때만 다시 만든다
const renderSkin = (kind, mood, bark, motion) => PetSkin.render(skin, $('#' + kind), $('#' + kind + 'Art'), kind, mood, bark, motion);
function setPetx(j) { if (j && PetAcc.set(j)) update(); }   // 소품·계절(허브 state 'petx')

/* ---------- 허브와 연결 (같은 출처라 CORS 문제가 없다) ---------- */
async function loadMacros() {
  try { macros = await (await fetch('/api/macros')).json(); connected = true; update(); } catch (e) { connected = false; }
}
async function loadSkin() {                              // 스킨은 허브가 정본 — 연결될 때마다 맞춘다
  try { const j = await (await fetch('/api/skin')).json(); setPetx(j.petx); if (skinChanged(j)) setSkin(j.skin || null, j.breed); } catch (e) {}
}
function connect() {
  const es = new EventSource('/events');
  es.onopen = () => { connected = true; loadMacros(); loadSkin(); };
  es.onerror = () => { connected = false; update(); };
  es.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.t === 'run') { PetMood.react(flash, m.run); if (!m.run.tool) loadMacros(); update(); noteRun(m.run); }
    else if (m.t === 'macros' || m.t === 'motion') loadMacros();
    else if (m.t === 'skin') { if (skinChanged(m)) setSkin(m.skin || null, m.breed); }
    else if (m.t === 'petx') setPetx(m.petx);
    else if (m.t === 'grow') onGrow(m);
    else if (m.t === 'notify') { PetMood.notify(flash, m); say('dog', (m.title || '알림') + (m.text ? ' — ' + m.text : ''), 6500); update(); }
  };
}

/* ---------- 마우스: 투명한 곳은 통과, 펫 위에서만 반응 ---------- */
function isHit(el) {
  if (!el) return false;
  if (el.closest && el.closest('.bubble.show, .note.show')) return true;
  if (el.closest && el.closest('.skin-media')) return true;                 // 스킨 그림(연출 fx 면 안쪽 img)
  return el instanceof SVGElement && el.tagName.toLowerCase() !== 'svg';     // 일의 종류 배지에서 칠해진 곳
}
let ignoring = null, dragging = false, drag = null;
function setIgnore(v) { if (ignoring !== v) { ignoring = v; if (api) api.setIgnore(v); } }
let petting = null;                                      // 마우스가 올라가 있는 펫('dog'·'cat') — 표정이 바뀌고 하트가 뜬다
function setPetting(v) { if (petting !== v) { petting = v; update(); } }
document.addEventListener('mousemove', e => {
  if (dragging) return;
  const hit = isHit(e.target);
  setIgnore(!hit);
  const p = hit && e.target.closest ? e.target.closest('.pet') : null;
  setPetting(p ? p.id : null);
});
document.addEventListener('mouseleave', () => { if (!dragging) { setIgnore(true); setPetting(null); } });

function petOf(el) { return el && el.closest ? el.closest('.pet') : null; }
document.addEventListener('pointerdown', e => {
  if (e.button !== 0 || !isHit(e.target)) return;
  drag = {x: e.screenX, y: e.screenY, moved: false, pet: petOf(e.target), note: !!(e.target.closest && e.target.closest('.note'))};
  try { e.target.setPointerCapture(e.pointerId); } catch (_) {}
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.screenX - drag.x, dy = e.screenY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 4) return;                    // 살짝 흔들린 건 클릭으로 본다
  if (!drag.moved) { drag.moved = true; dragging = true; document.body.classList.add('dragging'); }
  drag.x = e.screenX; drag.y = e.screenY;
  if (api) api.dragBy(dx, dy);
});
document.addEventListener('pointerup', e => {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.moved) {
    dragging = false; document.body.classList.remove('dragging');
    if (api) api.saveBounds();
    setIgnore(!isHit(document.elementFromPoint(e.clientX, e.clientY)));
  } else if (d.note) {
    openNote();
  } else {
    if (d.pet) { d.pet.classList.add('hop'); setTimeout(() => d.pet.classList.remove('hop'), 600); }
    if (api) api.openHub();                                              // 1단계: 클릭하면 허브 화면을 연다(2단계에서 방사형 메뉴로)
  }
});
document.addEventListener('contextmenu', e => { e.preventDefault(); if (isHit(e.target) && api) api.showMenu(); });
for (const k of ['dog', 'cat']) {
  $('#' + k).addEventListener('mouseenter', () => { const lv = PetAcc.lvText(); if (bubbles[k].text || lv) say(k, bubbles[k].text || '', 3000, lv); });
}

/* ---------- 키우기: 간식을 받으면 강아지가 살짝 뛰고, 레벨이 오르면 한 번 반짝 + 짧은 말 ---------- */
function flashClass(el, cls, ms) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); setTimeout(() => el.classList.remove(cls), ms); }
function onGrow(m) {
  PetAcc.set({lv: m.grow});
  if (!PetAcc.conf.grow || !m.gained) return;
  flashClass($('#dog'), 'treat', 700);
  if (!m.levelup) return;
  flashClass($('#dog'), 'lvup', 2700); flashClass($('#cat'), 'lvup', 2700);
  const a = PetAcc.unlockedAt(m.grow.level);
  showNote('Lv.' + m.grow.level + ' 이 됐어요' + (a ? ' — 「' + a + '」 소품이 풀렸어요' : ''), '/', {urgent: true});
  update();
}

/* ---------- 쪽지(말풍선): 한 번에 하나 · 잠깐 · 20분에 한 번(실패·레벨은 예외) · 조용히 시간엔 실패만 · 누르면 그 화면 ----------
   거리: 15분 안에 돌 시각 예약 · 자동화 실패 · 메신저 답할 대화 · 레벨 · 주간 한 줄(금 15시~ / 월 9~12시) · 프롬프트 팁(하루 한 번)
   허브 /api/petnote 를 2분마다 묻는다(메신저·회고 주소도 허브가 설정에서 알려 준다). 끄기: 펫 우클릭·꾸미기 → 말풍선(허브 state petx.bubble · quiet) */
const NOTE_GAP = 20 * 60 * 1000, NOTE_MS = 9000, NOTE_KEY = 'hub-pet-notes';
const note = {el: $('#note'), timer: 0, last: 0, path: null, seen: new Set(), ask: 0};
try { (JSON.parse(localStorage.getItem(NOTE_KEY) || '[]') || []).forEach(k => note.seen.add(k)); } catch (e) {}
const hm = t => { const d = new Date(t); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const today = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
function quietNow() {
  const q = PetAcc.conf.quiet || 'none', h = new Date().getHours();
  return ((q === 'lunch' || q === 'both') && h === 12) || ((q === 'night' || q === 'both') && (h >= 18 || h < 9));
}
function showNote(text, path, o) {
  o = o || {};
  if (PetAcc.conf.bubble === false) return false;
  if (o.key && note.seen.has(o.key)) return false;
  const now = Date.now();
  if (quietNow() && !o.fail) return false;
  if (!o.urgent && now - note.last < NOTE_GAP) return false;
  if (o.key) {
    note.seen.add(o.key);
    if (o.keep) try { localStorage.setItem(NOTE_KEY, JSON.stringify([...note.seen].filter(k => /^(week|tip):/.test(k)).slice(-30))); } catch (e) {}
  }
  note.last = now; note.path = path || '/';
  note.el.querySelector('span').textContent = text;
  note.el.classList.add('show'); document.body.classList.add('noting');
  clearTimeout(note.timer); note.timer = setTimeout(hideNote, o.ms || NOTE_MS);
  return true;
}
function hideNote() { note.el.classList.remove('show'); document.body.classList.remove('noting'); }
function openNote() {
  const p = note.path; hideNote();
  if (!p) return;
  if (api && api.openUrl) api.openUrl(p); else if (api) api.openHub(); else window.open(p, '_blank');
}
note.el.addEventListener('mouseenter', () => clearTimeout(note.timer));
note.el.addEventListener('mouseleave', () => { note.timer = setTimeout(hideNote, 2500); });
function noteRun(r) {                                    // 자동화 실패 — 기다리지 않고 바로(같은 자동화는 한 시간에 한 번)
  if (r.tool || !['fail', 'timeout'].includes(r.status) || ['test', 'service'].includes(r.trigger)) return;
  showNote('앗, 「' + r.name + '」 ' + (r.status === 'timeout' ? '시간이 넘어 멈췄어요' : '실패했어요'), '/?run=' + r.id,
    {urgent: true, fail: true, key: 'fail:' + r.macro + ':' + new Date().getHours()});
}
async function pollNotes() {
  let j;
  try { j = await (await fetch('/api/petnote')).json(); } catch (e) { return; }
  if (j.lv) PetAcc.set({lv: j.lv});
  for (const s of j.sched || [])
    if (showNote('⏰ ' + hm(s.next) + ' 「' + s.name + '」 곧 돌아요', '/ops', {key: 'sched:' + s.id + ':' + s.next})) return;
  if (j.ask != null) {
    const more = j.ask > note.ask; note.ask = j.ask;
    if (more && showNote('메신저에 답할 대화가 ' + j.ask + '개 있어요', j.chat || '/', {key: 'ask:' + j.ask + ':' + today() + ':' + new Date().getHours()})) return;
  }
  const d = new Date(), lv = PetAcc.conf.lv;
  if (PetAcc.conf.grow && lv) {                          // 주간 한 줄 — 금요일 오후엔 이번 주, 월요일 오전엔 지난주
    const fri = d.getDay() === 5 && d.getHours() >= 15, mon = d.getDay() === 1 && d.getHours() >= 9 && d.getHours() < 12;
    const w = fri ? lv.week : mon ? lv.prev_week : null;
    if (w && w.id && w.snacks > 0 && showNote((fri ? '이번 주' : '지난주') + ' 간식 ' + w.snacks + '개' + (w.fixes ? ' · 실패 ' + w.fixes + '번 고침' : ''),
      '/', {key: 'week:' + w.id + (fri ? ':f' : ':m'), keep: true})) return;
  }
  if (j.tip && j.retro && d.getHours() >= 14) showNote('프롬프트 한 줄 팁 — ' + j.tip, j.retro, {key: 'tip:' + today(), keep: true});
}
setTimeout(pollNotes, 20 * 1000); setInterval(pollNotes, 2 * 60 * 1000);
if (params.get('note') === 'demo') setTimeout(() => showNote('⏰ 09:30 「예약 메일 점검」 곧 돌아요', '/ops', {urgent: true, ms: 600000}), 1500);

/* ---------- 설정(메뉴에서 바꾼 것) ---------- */
function applySettings(s) {
  $('#slotDog').classList.toggle('off', !s.showDog);
  $('#slotCat').classList.toggle('off', !s.showCat);
  document.body.style.zoom = s.scale;
}
if (api) { api.getSettings().then(applySettings); api.onSettings(applySettings); }
if (api) {
  // 우클릭 메뉴의 모습·품종·소품 선택 — 허브가 기억하고 허브 화면과 같이 바뀐다. 값은 스킨 id · {breed: {dog: 'corgi'}} · {petx: {season, acc}}
  api.onSetSkin(v => {
    const px = v && typeof v === 'object' && v.petx;
    fetch(px ? '/api/petx' : '/api/skin', {method: 'POST', headers: {'Content-Type': 'application/json', 'X-Hub-Token': TOKEN},
      body: JSON.stringify(px ? px : v && typeof v === 'object' ? v : {skin: v})}).catch(() => {});
  });
  // 메뉴의 '펫 끄기' — 허브에 알려 '꺼 둔 상태'로 기억시킨다(그래야 허브를 다시 켤 때 펫이 되살아나지 않는다)
  api.onAskOff(() => fetch('/api/pet', {method: 'POST', headers: {'Content-Type': 'application/json', 'X-Hub-Token': TOKEN},
    body: JSON.stringify({on: false})}).catch(() => {}));
}
// 마우스 휠로 크기 조절 (펫 위에서)
document.addEventListener('wheel', e => {
  if (!api || !isHit(e.target)) return;
  e.preventDefault();
  api.scaleBy(e.deltaY < 0 ? 1 : -1);
}, {passive: false});

setInterval(update, 700);
update(); connect();
</script>
</body>
</html>
