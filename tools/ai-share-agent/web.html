<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 작업 회고</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='3' fill='%23f4efe6'/%3E%3Cpath d='M9 7h10l4 4v14H9z' fill='none' stroke='%232b2723' stroke-width='2'/%3E%3Cpath d='M12 15h8M12 19h8' stroke='%239a3f1d' stroke-width='2'/%3E%3C/svg%3E">
<style>
/* 디자인 B 「종이 노트」(2026-10-26) — 미색 종이 바탕 · 먹색 글자 · 벽돌색 포인트 · 칸은 카드 대신 가로줄 ·
   둥근 모서리 4px 이하 · 그림자·그라데이션 없음. D&C 허브 theme.css 와 같은 값. 웹 글꼴은 안 부른다(exe 안에서도 돌아야 함) */
:root {
  --bg: #f4efe6; --panel: #f4efe6; --solid: #fffaf2; --soft: #ece5d9; --line: #ddd3c3; --rule: #2b2723; --field: #8c8276;
  --text: #2b2723; --muted: #6a6157; --accent: #9a3f1d; --accent-bg: #efe1d3; --onaccent: #f4efe6;
  --ok: #3f6b3a; --warn: #9a6412; --danger: #b42318; --info: #355a78;
  --violet: var(--muted); --rose: var(--accent); --teal: var(--info);
  --code-bg: #ece5d9; --hover: #ede6da; --sel: #fffaf2;
  --serif: 'Gowun Batang', 'Batang', 'AppleMyungjo', serif;
  --sans: 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif;
  color-scheme: light;
}
/* 다크 — 테마 버튼이 "자동"이면 Windows 설정을 따르고, "어둡게"를 고르면 강제로 켠다 */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1f1c19; --panel: #1f1c19; --solid: #27231f; --soft: #2b2722; --line: #3a342e; --rule: #ece5da; --field: #8a8074;
    --text: #ece5da; --muted: #b3a998; --accent: #d9875f; --accent-bg: #352820; --onaccent: #1f1c19;
    --ok: #8fbb86; --warn: #d9a55a; --danger: #f08a7a; --info: #93b4cf;
    --code-bg: #2b2722; --hover: #26221e; --sel: #27231f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1f1c19; --panel: #1f1c19; --solid: #27231f; --soft: #2b2722; --line: #3a342e; --rule: #ece5da; --field: #8a8074;
  --text: #ece5da; --muted: #b3a998; --accent: #d9875f; --accent-bg: #352820; --onaccent: #1f1c19;
  --ok: #8fbb86; --warn: #d9a55a; --danger: #f08a7a; --info: #93b4cf;
  --code-bg: #2b2722; --hover: #26221e; --sel: #27231f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 14px/1.55 var(--sans); }
h1, h2, h3 { font-family: var(--serif); }
a { color: var(--accent); }
::selection { background: color-mix(in srgb, var(--accent) 25%, transparent); }
header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 16px 9px;
  border-bottom: 2px solid var(--rule); background: var(--bg); }
header h1 { font-size: 22px; font-weight: 700; margin: 0; line-height: 1.2; }
.spacer { flex: 1; }
.range { white-space: nowrap; }
.tools { display: flex; gap: 6px 8px; align-items: center; flex-wrap: wrap; }
#report { max-width: 240px; }
input, select { font: inherit; color: var(--text); background: transparent; border: 0; border-bottom: 1px solid var(--field);
  border-radius: 0; padding: 3px 2px; min-width: 0; }
select { cursor: pointer; }
select option { background: var(--solid); color: var(--text); }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--text); }
button { font: inherit; font-size: 13px; color: var(--text); background: transparent; border: 1px solid var(--field);
  border-radius: 3px; padding: 3px 10px; cursor: pointer; }
button:hover { background: var(--hover); border-color: var(--text); }
button.primary { background: var(--text); color: var(--onaccent); border-color: var(--text); font-weight: 600; padding: 3px 14px; }
button.primary:hover { background: color-mix(in srgb, var(--text) 85%, var(--bg)); }
button:disabled { opacity: .5; cursor: wait; }
main { display: grid; grid-template-columns: minmax(0, 11fr) minmax(0, 9fr); flex: 1; min-height: 0; }
.pane { overflow: auto; min-height: 0; }
.left { border-right: 1px solid var(--line); display: flex; flex-direction: column; }
.filters { display: flex; gap: 6px 10px; flex-wrap: wrap; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--line);
  position: sticky; top: 0; background: var(--bg); z-index: 2; }
.filters input[type=search] { flex: 1; min-width: 160px; }
.list { overflow: auto; flex: 1; container-type: inline-size; }
table.tk { width: 100%; border-collapse: collapse; font-size: 13px; }
table.tk th { position: sticky; top: 0; background: var(--bg); text-align: left; font-weight: 600; font-size: 12px;
  color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--rule); cursor: pointer; white-space: nowrap; }
table.tk th.on { color: var(--text); }
table.tk td { padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.tk tr { cursor: pointer; }
table.tk tbody tr:hover { background: var(--hover); }
table.tk tr.cur { background: var(--sel); }
table.tk tr.cur td:first-child { box-shadow: inset 2px 0 var(--accent); }
table.tk tr.s-발표고정 td:first-child { box-shadow: inset 2px 0 var(--ok); }
table.tk tr.s-발표제외 td, table.tk tr.s-비공개 td { color: var(--muted); }
table.tk tr.s-비공개 td:first-child { box-shadow: inset 2px 0 var(--danger); }
td.key { white-space: nowrap; font-variant-numeric: tabular-nums; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
td.title { max-width: 360px; overflow-wrap: anywhere; }
td.title .t { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.part { font-size: 11px; padding: 0 4px; border: 1px solid var(--line); border-radius: 2px; color: var(--muted); margin-right: 4px; }
.h-grilling { color: var(--ok); font-weight: 600; }
.h-doc { color: var(--warn); }
select.st { padding: 0 2px; font-size: 12px; }
select.st.v-발표고정 { color: var(--ok); font-weight: 600; }
select.st.v-발표제외 { color: var(--warn); }
select.st.v-비공개 { color: var(--danger); }
.right { background: var(--bg); }
.bar { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--line); padding: 10px 20px;
  display: flex; gap: 8px 12px; align-items: center; flex-wrap: wrap; z-index: 2; }
.bar .memo { flex: 1; min-width: 160px; }
.doc { padding: 4px 24px 40px; max-width: 980px; }
.teamform { padding: 16px 24px 40px; max-width: 760px; }
.teamform h2 { font-size: 19px; margin: 4px 0 4px; padding-top: 8px; border-top: 2px solid var(--rule); }
.teamform .hint { font-size: 12.5px; color: var(--muted); margin: 0 0 14px; }
.teamform label { display: block; font-weight: 600; font-size: 13px; margin: 14px 0 4px; }
.teamform label small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.teamform textarea { width: 100%; font: inherit; color: var(--text); background: transparent; border: 1px solid var(--line);
  border-radius: 3px; padding: 6px 8px; resize: vertical; }
.teamform .btns { display: flex; gap: 8px; margin-top: 16px; align-items: center; flex-wrap: wrap; }
.teamform .msg { font-size: 12.5px; color: var(--muted); }
.prompts { margin: 12px 24px 0; max-width: 932px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.prompts summary { cursor: pointer; padding: 7px 0; font-size: 13px; color: var(--text); font-weight: 600; }
.prompts summary span { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 6px; }
.prompts .sess { padding: 4px 0 8px; border-top: 1px solid var(--line); }
.prompts .sh { font-size: 12px; color: var(--muted); margin: 6px 0 2px; }
.prompts ol { margin: 0; padding-left: 22px; font-size: 13px; }
.prompts li { white-space: pre-wrap; word-break: break-word; margin: 2px 0; }
.doc h1 { font-size: 24px; } .doc h2 { font-size: 18px; border-top: 2px solid var(--rule); padding-top: 6px; margin-top: 28px; }
.doc h3 { font-size: 15px; } .doc h4, .doc h5, .doc h6 { font-size: 14px; }
.doc code { background: var(--code-bg); padding: 1px 4px; border-radius: 2px; font: 12.5px/1.5 Consolas, "D2Coding", monospace; }
.doc pre { background: var(--code-bg); padding: 10px 12px; border-radius: 3px; overflow: auto; }
.doc pre code { padding: 0; background: none; }
.doc blockquote { margin: 8px 0; padding: 2px 12px; border-left: 2px solid var(--field); color: var(--muted); }
.doc hr { border: 0; border-top: 1px solid var(--line); }
.doc ul { padding-left: 20px; } .doc li.n { list-style: none; margin-left: -16px; }
.doc .tw { overflow: auto; } .doc table { border-collapse: collapse; margin: 8px 0; font-size: 13px; }
.doc th, .doc td { border-bottom: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
.doc thead th { border-bottom: 1px solid var(--rule); font-weight: 600; }
.doc th, .doc td.s { white-space: nowrap; }
.doc table.fm { font-size: 12px; color: var(--muted); } .doc table.fm th { width: 90px; font-weight: 500; }
.empty { padding: 40px 24px; color: var(--muted); }
#status { font-size: 12px; color: var(--muted); max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.period { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.me { font-size: 12.5px; font-weight: 600; color: var(--text); }
.me::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
  margin-right: 6px; vertical-align: 2px; }
.me:empty { display: none; }
td.owner { white-space: nowrap; font-size: 12.5px; }
td.shop { white-space: nowrap; max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
.who { color: var(--muted); }
.who.mine { color: var(--accent); font-weight: 600; }
.shown { align-self: center; font-size: 12px; color: var(--muted); margin-left: auto; }
/* 요약 — 내 파트 기준 숫자. 위 굵은 선 + 칸 사이 세로줄, 고른 칸만 면 색. 칸을 누르면 아래 목록이 그 조건으로 걸러진다 */
.dash { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); grid-auto-flow: dense; gap: 0;
  margin: 12px 16px 0; border-top: 2px solid var(--rule); border-bottom: 1px solid var(--line); overflow: hidden; }
.card { --c: var(--accent); background: transparent; border: 0; border-left: 1px solid var(--line); border-top: 1px solid var(--line);
  margin: -1px 0 0 -1px; border-radius: 0; padding: 9px 14px 10px; cursor: pointer; text-align: left; font: inherit; color: inherit; }
.card:hover { background: var(--hover); border-color: var(--line); }
.card.on, .card.on:hover { background: var(--solid); }
.card.c-blue { --c: var(--info); } .card.c-green { --c: var(--ok); } .card.c-amber { --c: var(--warn); }
.card.c-violet { --c: var(--muted); } .card.c-gray { --c: var(--muted); } .card.c-rose { --c: var(--accent); } .card.c-teal { --c: var(--info); }
.rec { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 6px; vertical-align: 2px; }
.why { display: block; font-size: 11.5px; color: var(--accent); margin-top: 2px; }
button.toggle.on { background: var(--solid); border-color: var(--text); color: var(--text); font-weight: 600; }
.card .k { font-size: 12px; color: var(--muted); font-weight: 600; }
.card .k::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--c);
  margin-right: 6px; vertical-align: 1px; }
.card .v { font: 700 26px/1.25 var(--serif); font-variant-numeric: tabular-nums; color: var(--text); }
.card .v small { font: 500 12.5px var(--sans); color: var(--muted); margin-left: 4px; }
.card .sub { font-size: 12px; color: var(--muted); }
.card .meter { height: 2px; background: var(--line); margin: 4px 0 3px; overflow: hidden; }
.card .meter i { display: block; height: 100%; background: var(--c); }
.card.shops { cursor: default; grid-column: span 2; }
.card.shops:hover { background: transparent; }
.shops .list2 { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 6px; }
.shops .list2 button { font-size: 12px; padding: 1px 7px; border-radius: 2px; background: transparent; border: 1px solid var(--line); }
.shops .list2 button:hover { border-color: var(--text); background: transparent; }
.shops .list2 b { font-variant-numeric: tabular-nums; color: var(--accent); margin-left: 4px; }
.card.other .k::before { background: transparent; border: 1px solid var(--muted); }
.weekly { padding: 12px 24px 40px; max-width: 980px; }
.weekly .btns { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0 12px; }
.weekly .msg { font-size: 12.5px; color: var(--muted); }
.hide { display: none !important; }
/* 태그 칩 · 이어진 이슈(언급한·언급된) · 본문 검색에 걸린 줄 */
.chips { display: flex; flex-wrap: wrap; gap: 4px 6px; padding: 8px 24px 0; max-width: 932px; }
.chip { font-size: 12px; padding: 0 8px; border-radius: 2px; border: 1px solid var(--line); color: var(--muted); background: transparent; }
.chip i { font-style: normal; opacity: .7; margin-right: 3px; }
.chip:hover { border-color: var(--text); color: var(--text); background: transparent; }
.chip.on { border-color: var(--accent); color: var(--accent); }
.links { margin: 10px 24px 0; max-width: 932px; border-top: 1px solid var(--line); font-size: 13px; }
.links .lk { display: flex; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--line); }
.links .lk > b { flex: 0 0 120px; font-weight: 600; color: var(--muted); font-size: 12px; }
.links .lk span { display: flex; flex-wrap: wrap; gap: 2px 10px; }
.links small { color: var(--muted); }
.hit { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
  font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.hit mark { background: var(--accent-bg); color: var(--text); }
/* 창 크기에 맞춤 — 표 칸은 목록 폭(컨테이너)을 보고 덜 중요한 열부터 감춘다: 커밋·하네스 → 꼬리표 → 담당·수정일 → 선택.
   꼬리표·하네스 열은 설정에 따라 빠지기도 해서 순서(nth-child) 대신 열 이름(data-col)으로 고른다 */
@container (max-width: 760px) { table.tk [data-col=commits], table.tk [data-col=harness] { display: none; } }
@container (max-width: 620px) { table.tk [data-col=tag] { display: none; } }
@container (max-width: 500px) { table.tk [data-col=owner], table.tk [data-col=updated] { display: none; } }
@container (max-width: 400px) { table.tk [data-col=select] { display: none; } }
.backbar { display: none; }
@media (max-width: 1250px) { .dash { grid-template-columns: repeat(4, 1fr); } .card.shops { grid-column: span 2; } }
/* 1000px 아래는 한 칸 — 목록이 폭을 다 쓰고, 이슈·주간 보고·자료를 고르면 그 내용이 폭을 다 쓴다(맨 위 「← 목록」·뒤로 가기·Esc·Alt+← 로 돌아감) */
@media (max-width: 999px) {
  body { display: block; height: auto; }
  main { grid-template-columns: minmax(0, 1fr); }
  .pane { overflow: visible; } .left { border-right: 0; } .list { overflow: visible; }
  table.tk th { position: static; }
  td.title { max-width: none; }
  .right { display: none; }
  body.view-doc .left, body.view-doc .dash { display: none; }
  body.view-doc .right { display: block; }
  .backbar { display: flex; gap: 10px; align-items: center; position: sticky; top: 0; z-index: 3; padding: 7px 16px;
    background: var(--bg); border-bottom: 1px solid var(--rule); }
  .backbar button { flex: none; font-weight: 600; }
  #backTitle { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; color: var(--muted); }
  .bar { position: static; padding: 8px 16px; }
  .doc { padding: 4px 16px 40px; } .teamform { padding: 12px 16px 40px; } .weekly { padding: 12px 16px 40px; }
  .weekly .doc { padding-left: 0; padding-right: 0; }
  .prompts { margin: 10px 16px 0; } .chips { padding: 8px 16px 0; } .links { margin: 10px 16px 0; }
}
@media (max-width: 900px) { .dash { grid-template-columns: repeat(2, 1fr); } .card.shops { grid-column: span 2; } }
@media (max-width: 600px) {
  header { padding: 8px 12px; gap: 6px 12px; } header h1 { font-size: 20px; }
  .tools { gap: 6px; } .tools button { padding: 3px 8px; } input[type=date] { width: 8.6em; }
  #report { max-width: 100%; flex: 1 1 140px; }
  #status { max-width: 100%; flex-basis: 100%; } #status:empty { display: none; }
  .dash { margin: 10px 12px 0; } .card { padding: 7px 12px 8px; } .card .v { font-size: 21px; }
  .filters { padding: 8px 12px; } .filters input[type=search] { flex-basis: 100%; min-width: 0; }
  .backbar { padding: 6px 12px; } .bar { padding: 8px 12px; }
  .doc, .teamform, .weekly { padding-left: 12px; padding-right: 12px; } .prompts { margin: 10px 12px 0; }
  .weekly .doc { padding-left: 0; padding-right: 0; }
  .chips { padding-left: 12px; padding-right: 12px; } .links { margin-left: 12px; margin-right: 12px; }
  .links .lk { flex-wrap: wrap; gap: 2px 8px; } .links .lk > b { flex-basis: 100%; }
  .doc table.fm { display: block; overflow-x: auto; }
  table.tk td, table.tk th { padding-left: 6px; padding-right: 6px; }
}
</style>
</head>
<body>
<header>
  <h1>AI 작업 회고</h1>
  <span class="period" id="period"></span>
  <span class="me" id="me" title="이슈 도구 토큰 주인·git 설정에서 자동으로 판별한 나"></span>
  <div class="spacer"></div>
  <div class="tools">
    <button id="btnTheme" title="화면 테마: 자동(Windows 설정) → 밝게 → 어둡게"></button>
    <button id="btnTeam" title="팀 명단·이름 별칭 편집">팀 명단</button>
    <button id="btnIndex">INDEX</button>
    <button id="btnWeekly" title="이번 주(월요일~오늘) 주간 업무 보고 초안 — LLM 을 부른다">주간 보고 초안</button>
    <select id="report"><option value="">보고·발표 자료…</option></select>
    <span class="range"><input type="date" id="since" title="수집 시작일"> ~ <input type="date" id="until" title="수집 종료일"></span>
    <button id="btnCollect" class="primary" title="이슈·git·기록 다시 수집 (LLM 없음)">수집</button>
    <span id="status"></span>
  </div>
</header>
<section class="dash" id="dash"></section>
<main>
  <section class="pane left">
    <div class="filters">
      <input type="search" id="q" placeholder="이슈·제목·메모·본문 검색">
      <button class="chip on" id="tagOn" hidden title="이 태그로 거르는 중 — 누르면 풀기"></button>
      <select id="fPart"><option value="">파트 전체</option></select>
      <select id="fOwner"><option value="">담당 전체</option></select>
      <select id="fHarness" title="하네스 기록 · AI 리뷰"><option value="">하네스 전체</option><option value="grilling">grilling</option><option value="doc">doc</option><option value="none">기록 없음</option><option value="bot" id="optBot">AI 리뷰 지적 있음</option></select>
      <select id="fSel"><option value="">선택 전체</option><option value="-">미지정</option><option>발표고정</option><option>발표제외</option><option>비공개</option></select>
      <button class="toggle" id="btnRec" title="발표 사례 추천 점수 상위 10건만 보기">추천만</button>
      <span class="shown" id="shown"></span>
    </div>
    <div class="list">
      <table class="tk">
        <thead><tr>
          <th data-col="select">선택</th><th data-col="key">이슈</th><th data-col="owner">담당</th><th data-col="tag" id="thTag">꼬리표</th><th data-col="title">제목</th>
          <th data-col="status">상태</th><th data-col="commits">커밋</th><th data-col="harness" id="thHarness">하네스</th><th data-col="updated">수정일</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
  <section class="pane right" id="paneR">
    <div class="backbar"><button id="btnBack" title="목록으로 (Esc · Alt+← · 뒤로 가기)">← 목록</button><span id="backTitle"></span></div>
    <div id="viewer"><div class="empty">왼쪽에서 이슈를 고르면 내용이 여기 보입니다. <b>주간 보고 초안</b> 은 이번 주 한 일을 보고서 초안으로 씁니다.<br>
    <b>추천</b> 건은 따로 고르지 않아도 발표 자료 후보로 먼저 들어갑니다.<br>선택: <b>발표고정</b> 추천 밖이어도 발표 사례로 꼭 넣음 · <b>발표제외</b> 기록엔 두고 발표에선 뺌 · <b>비공개</b> 내 PC에만, 발표 프롬프트에서도 제외</div></div></section>
</main>
<script>
const STATES = ["발표고정", "발표제외", "비공개"];
const S = { tickets: [], byKey: {}, sort: { col: "default", dir: 1 }, cur: null, F: {}, keyRe: null, mine: "", other: "", meNames: [],
  rec: new Set(), recOnly: true,   // 처음엔 추천 사례만 — 전부(수백 건) 보여 주면 고르기 어렵다
  tag: null, hits: new Map(), back: {} };   // 거르는 태그 [종류, 값] · 본문 검색 결과(part/key → 앞뒤 글) · 백링크(키 → 언급한 이슈 키들)
// 태그 = labels(#) · 꼬리표(설정 ai_share.tag 이름) · 유형 · 상태
const tagName = k => ({ label: "#", tag: S.F.tag || "꼬리표", type: "유형", status: "상태" }[k]);
const tagsOf = t => [...(t.labels || []).map(v => ["label", v]), ["tag", t.tag], ["type", t.type], ["status", t.status]].filter(x => x[1]);
const tagChip = ([k, v], on) => `<button class="chip${on ? " on" : ""}" data-tk="${k}" data-tv="${esc(v)}"><i>${esc(tagName(k))}</i>${esc(v)}</button>`;
const REC_N = 10, REC_MIN = 4;
const $ = id => document.getElementById(id);

async function api(path, body) {
  const opt = body ? { method: "POST", headers: { "Content-Type": "application/json", "X-AI-Share": "1" }, body: JSON.stringify(body) } : {};
  const r = await fetch(path, opt);
  const j = await r.json();
  if (!r.ok && !("log" in j)) throw new Error(j.error || r.status);
  return j;
}

// ---------- markdown (외부 라이브러리 없이 기록 문서에 나오는 문법만)
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function inline(raw) {
  return raw.split(/(`[^`]+`)/).map((seg, i) => i % 2 ? "<code>" + esc(seg.slice(1, -1)) + "</code>" :
    esc(seg).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>')
      .replace(S.keyRe || /(?!)/g, k => S.byKey[k] ? `<a href="#" data-open="${esc(k)}">${k}</a>` : k)
  ).join("");
}
function mdTable(rows) {
  const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
  let head = cells(rows[0]), body = rows.slice(1);
  if (body.length && /^[\s|:-]+$/.test(body[0])) body = body.slice(1); else { head = null; body = rows; }
  return '<div class="tw"><table>' + (head ? "<thead><tr>" + head.map(c => `<th>${inline(c)}</th>`).join("") + "</tr></thead>" : "") +
    // 짧은 칸(날짜·티켓 키·상태 등)은 줄바꿈하지 않는다 — 긴 설명 칸만 감긴다
    "<tbody>" + body.map(r => "<tr>" + cells(r).map(c => `<td${c.length <= 24 ? ' class="s"' : ""}>${inline(c)}</td>`).join("") + "</tr>").join("") + "</tbody></table></div>";
}
function render(md) {
  const L = md.replace(/\r/g, "").split("\n"), out = [];
  let i = 0, para = [];
  const flush = () => { if (para.length) { out.push("<p>" + para.map(inline).join("<br>") + "</p>"); para = []; } };
  if (L[0] === "---") {                                   // front matter → 작은 표
    const rows = []; let j = 1;
    for (; j < L.length && L[j] !== "---"; j++) { const m = L[j].match(/^(\w+):\s?(.*)$/); if (m && m[2]) rows.push(m); }
    out.push('<table class="fm">' + rows.map(m => `<tr><th>${esc(m[1])}</th><td>${inline(m[2])}</td></tr>`).join("") + "</table>");
    i = j + 1;
  }
  while (i < L.length) {
    const l = L[i]; let m;
    if (/^\s*```/.test(l)) {
      flush(); const buf = []; i++;
      while (i < L.length && !/^\s*```/.test(L[i])) buf.push(L[i++]);
      i++; out.push("<pre><code>" + esc(buf.join("\n")) + "</code></pre>"); continue;
    }
    if ((m = l.match(/^(#{1,6})\s+(.*)$/))) { flush(); out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); i++; continue; }
    if (/^\s*\|/.test(l)) { flush(); const rows = []; while (i < L.length && /^\s*\|/.test(L[i])) rows.push(L[i++]); out.push(mdTable(rows)); continue; }
    if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
      flush(); const items = [];
      while (i < L.length && /^\s*([-*]|\d+\.)\s+/.test(L[i])) {
        const mm = L[i].match(/^(\s*)([-*]|\d+\.)\s+(.*)$/), num = /\d/.test(mm[2]);
        items.push(`<li class="${num ? "n" : ""}" style="margin-left:${Math.min(mm[1].length, 8) * 0.7}em">${num ? mm[2] + " " : ""}${inline(mm[3])}</li>`); i++;
      }
      out.push("<ul>" + items.join("") + "</ul>"); continue;
    }
    if (/^>\s?/.test(l)) { flush(); const q = []; while (i < L.length && /^>\s?/.test(L[i])) q.push(L[i++].replace(/^>\s?/, "")); out.push("<blockquote>" + q.map(inline).join("<br>") + "</blockquote>"); continue; }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(l)) { flush(); out.push("<hr>"); i++; continue; }
    if (!l.trim()) { flush(); i++; continue; }
    para.push(l); i++;
  }
  flush();
  return out.join("\n");
}

// ---------- 목록
function stSelect(t) {
  return `<select class="st v-${t.select || "none"}" data-key="${esc(t.key)}">` +
    ["", ...STATES].map(s => `<option value="${s}"${s === t.select ? " selected" : ""}>${s || "—"}</option>`).join("") + "</select>";
}
// 추천 = 내 파트에서 점수 REC_MIN 이상 상위 REC_N 건. 발표제외·비공개는 빼고, 고른 즉시 다시 계산된다
function computeRec() {
  S.rec = new Set(S.tickets
    .filter(t => t.mine && t.score >= REC_MIN && t.updated >= S.recCut && !["발표제외", "비공개"].includes(t.select))
    .sort((a, b) => b.score - a.score || (a.updated < b.updated ? 1 : -1))
    .slice(0, REC_N).map(t => t.key));
}
function filtered() {
  if (S.recOnly) return S.tickets.filter(t => t.mine && S.rec.has(t.key));
  const q = $("q").value.trim().toLowerCase(), p = $("fPart").value, h = $("fHarness").value, s = $("fSel").value;
  const o = $("fOwner").value, tg = S.tag;
  return S.tickets.filter(t =>
    (!p || (p === "mine" ? t.mine : p === "team" ? t.part === S.mine && !t.mine : t.part === p)) && (!h || (h === "bot" ? t.bot_issues > 0 : t.harness === h)) &&
    (!o || (t.owner || "").split(", ").includes(o)) &&
    (!s || (s === "-" ? !t.select : t.select === s)) &&
    (!tg || tagsOf(t).some(x => x[0] === tg[0] && x[1] === tg[1])) &&
    (!q || metaHit(t, q) || S.hits.has(t.part + "/" + t.key)));
}
const metaHit = (t, q) => [t.key, t.disp, t.tag, t.title, t.memo, t.status, t.owner, ...(t.labels || [])].join(" ").toLowerCase().includes(q);
// 본문에만 걸린 줄은 제목 아래에 걸린 곳 앞뒤 글을 보인다
function hitLine(t) {
  const q = $("q").value.trim().toLowerCase();
  const snip = q && !S.recOnly && !metaHit(t, q) && S.hits.get(t.part + "/" + t.key);
  if (!snip) return "";
  const w = q.split(/\s+/)[0], i = snip.toLowerCase().indexOf(w);
  return `<span class="hit">본문 · ${i < 0 ? esc(snip) : esc(snip.slice(0, i)) + "<mark>" + esc(snip.slice(i, i + w.length)) + "</mark>" + esc(snip.slice(i + w.length))}</span>`;
}
// 본문 검색은 서버에 묻는다(이슈 문서 전체를 화면에 싣지 않으려고) — 치는 동안은 제목 등으로만 거르고, 답이 오면 더한다
let searchTimer = 0;
function searchBodies() {
  clearTimeout(searchTimer);
  const q = $("q").value.trim().toLowerCase();
  if (!q) { S.hits = new Map(); return; }
  searchTimer = setTimeout(async () => {
    try {
      const j = await api("/api/search?q=" + encodeURIComponent(q));
      if ($("q").value.trim().toLowerCase() !== q) return;          // 그 사이 더 쳤다
      S.hits = new Map(j.hits.map(h => [h.part + "/" + h.key, h.snip]));
      renderRows();
    } catch (e) {}
  }, 250);
}
function sorted(list) {
  const { col, dir } = S.sort;
  const v = t => col === "default" ? [t.mine ? 0 : t.part === S.mine ? 1 : 2, -Date.parse(t.updated || 0)] : [t[col] ?? ""];
  return list.slice().sort((a, b) => {
    const x = v(a), y = v(b);
    for (let i = 0; i < x.length; i++) { if (x[i] < y[i]) return -dir; if (x[i] > y[i]) return dir; }
    return 0;
  });
}
function renderRows() {
  computeRec();
  const list = sorted(filtered());
  $("rows").innerHTML = list.map(t => `<tr class="s-${t.select || "none"}${S.cur && S.cur.key === t.key && S.cur.part === t.part ? " cur" : ""}" data-part="${esc(t.part)}" data-key="${esc(t.key)}">
    <td data-col="select">${stSelect(t)}</td>
    <td class="key"><span class="part">${esc(t.part)}</span>${esc(t.disp || t.key)}</td>
    <td class="owner" data-col="owner">${(t.owner || "").split(", ").filter(Boolean).map(w => `<span class="who${S.meNames.includes(w) ? " mine" : ""}">${esc(w)}</span>`).join(" ")}</td>
    ${S.F.tag ? `<td class="shop" data-col="tag" title="${esc(t.tag)}">${esc(t.tag)}</td>` : ""}<td class="title" title="${esc(t.title)}"><span class="t">${S.rec.has(t.key) && t.mine ? '<span class="rec"></span>' : ""}${esc(t.title)}</span>${S.rec.has(t.key) && t.mine ? `<span class="why">${esc(t.why)}</span>` : ""}${hitLine(t)}${t.memo ? `<br><small style="color:var(--muted)">메모 · ${esc(t.memo)}</small>` : ""}</td>
    <td>${esc(t.status)}</td><td class="num" data-col="commits">${t.commits || ""}</td>
    ${S.F.harness ? `<td class="h-${t.harness}" data-col="harness">${t.harness === "none" ? "" : t.harness}</td>` : ""}<td class="key" data-col="updated">${t.updated}</td></tr>`).join("");
  document.querySelectorAll("table.tk th").forEach(th => {
    th.classList.toggle("on", th.dataset.col === S.sort.col);
    th.textContent = th.textContent.replace(/ [▲▼]$/, "") + (th.dataset.col === S.sort.col ? (S.sort.dir > 0 ? " ▲" : " ▼") : "");
  });
  $("shown").textContent = S.recOnly ? `추천 ${list.length}건 · 전체 ${S.tickets.filter(t => t.mine).length}건` : `${list.length}건 표시`;
  $("btnRec").classList.toggle("on", S.recOnly);
  $("tagOn").hidden = !S.tag;
  if (S.tag) $("tagOn").innerHTML = `<i>${esc(tagName(S.tag[0]))}</i>${esc(S.tag[1])} ✕`;
  renderDash();
}
// 요약 대시보드 — 숫자는 내 파트 기준. 카드를 누르면 목록 필터가 그 조건으로 바뀐다
function renderDash() {
  const mine = S.tickets.filter(t => t.mine);
  const n = f => mine.filter(f).length;
  const harn = n(t => t.harness !== "none"), pct = mine.length ? Math.round(harn * 100 / mine.length) : 0;
  const repos = new Set(mine.flatMap(t => t.repos ? t.repos.split(", ") : []));
  const commits = mine.reduce((a, t) => a + (t.commits || 0), 0);
  const shops = {};
  mine.forEach(t => { if (t.tag) shops[t.tag] = (shops[t.tag] || 0) + 1; });
  const top = Object.entries(shops).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const otherList = S.other ? S.tickets.filter(t => t.part === S.other) : [];
  const other = otherList.length, ow = {};
  otherList.forEach(t => (t.owner || "").split(", ").filter(Boolean).forEach(w => ow[w] = (ow[w] || 0) + 1));
  // 팀원 것 — 내 파트에서 내가 손대지 않은 티켓, 담당자별
  const teamList = S.tickets.filter(t => t.part === S.mine && !t.mine), tw = {};
  teamList.forEach(t => (t.owner || "").split(", ").filter(Boolean).forEach(w => tw[w] = (tw[w] || 0) + 1));
  const aiPct = w => { const a = (S.stats || {})[w]; return a && a.commits ? ` (AI ${Math.round(a.ai * 100 / a.commits)}%)` : ""; };
  const twTop = Object.entries(tw).sort((a, b) => b[1] - a[1]).slice(0, 4).map(([w, c]) => `${esc(w)} ${c}${aiPct(w)}`).join(" · ");
  // 내 AI 활용 — Claude 공동작성 커밋 비율 · AI 리뷰가 지적한 내 MR
  const meName = S.meNames[0] || "", ms = (S.stats || {})[meName] || null;
  const myAi = ms && ms.commits ? Math.round(ms.ai * 100 / ms.commits) : null;
  const owTop = Object.entries(ow).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([w, c]) => `${esc(w)} ${c}`).join(" · ");
  $("dash").innerHTML = `
    <button class="card c-rose${S.recOnly ? " on" : ""}" data-act="rec"><div class="k">추천 사례</div>
      <div class="v">${S.rec.size}<small>건</small></div>
      <div class="sub">최근 ${S.recDays}일 · 되돌림·규모·최근${S.F.harness ? "·grilling" : ""}${S.F.review ? "·AI 리뷰" : ""} 점수 상위</div></button>
    <button class="card c-blue" data-act="all"><div class="k">내 티켓</div>
      <div class="v">${mine.length}<small>건</small></div>
      <div class="sub" title="티켓마다 연결된 커밋 수를 더한 값 — 여러 티켓에 걸친 커밋은 중복으로 센다">티켓에 연결된 커밋 ${commits} · 레포 ${repos.size}개</div></button>
    ${S.F.harness ? `<button class="card c-green" data-act="harness"><div class="k">하네스 기록</div>
      <div class="v">${harn}<small>건 · ${pct}%</small></div>
      <div class="meter"><i style="width:${pct}%"></i></div>
      <div class="sub">grilling ${n(t => t.harness === "grilling")} · doc ${n(t => t.harness === "doc")}</div></button>` : ""}
    <button class="card c-amber" data-act="pinned"><div class="k">발표고정</div>
      <div class="v">${n(t => t.select === "발표고정")}<small>건</small></div>
      <div class="sub">제외 ${n(t => t.select === "발표제외")} · 비공개 ${n(t => t.select === "비공개")}</div></button>
    ${S.F.tag ? `<div class="card c-violet shops"><div class="k">자주 나온 ${esc(S.F.tag)}</div>
      <div class="list2">${top.map(([s, c]) => `<button data-shop="${esc(s)}">${esc(s)}<b>${c}</b></button>`).join("")}</div></div>` : ""}
    ${myAi !== null ? `<button class="card c-green" data-act="${S.F.review ? "bot" : "all"}"><div class="k">Claude 공동작성 커밋</div>
      <div class="v">${myAi}<small>%</small></div>
      <div class="meter"><i style="width:${myAi}%"></i></div>
      <div class="sub">${ms.ai}/${ms.commits} 커밋${S.F.review ? ` · AI 리뷰 지적 MR ${ms.bot_mrs}/${ms.mrs}` : ""}</div></button>` : ""}
    ${teamList.length ? `<button class="card c-teal${$("fPart").value === "team" ? " on" : ""}" data-act="team"><div class="k">팀원 티켓</div>
      <div class="v">${teamList.length}<small>건</small></div>
      <div class="sub">${twTop}</div></button>` : ""}
    ${S.other ? `<button class="card c-gray other" data-act="other"><div class="k">${esc(S.other)} 파트 (참고)</div>
      <div class="v">${other}<small>건</small></div>
      <div class="sub">${owTop}</div>
      <div class="sub">${$("fPart").value === S.other ? "보는 중 · 누르면 내 것만" : "숨김 · 누르면 보기"}</div></button>` : ""}`;
}

// ---------- 보기
// 내가 Claude 에게 친 프롬프트 — 이 PC 의 대화 기록에서만 읽는다. 기록 문서·발표 자료에는 들어가지 않는다
function promptsBox(sessions) {
  if (!sessions.length) return "";
  const n = sessions.reduce((a, s) => a + s.prompts.length, 0);
  return `<details class="prompts"><summary>내 프롬프트 <b>${sessions.length}</b>세션 · ${n}개
      <span>이 PC에서만 보임 · 발표 자료·공유 기록에는 안 들어감</span></summary>
    ${sessions.sort((a, b) => a.date < b.date ? 1 : -1).map(s => `<div class="sess">
      <div class="sh">${esc(s.date)} · ${esc(s.title || "(제목 없음)")}${s.branch ? ` · <code>${esc(s.branch)}</code>` : ""}</div>
      <ol>${s.prompts.map(p => `<li>${esc(p.text)}</li>`).join("")}</ol></div>`).join("")}
  </details>`;
}
// 이어진 이슈 — 이 문서가 언급한 이슈 · 이 이슈를 언급한 이슈(백링크). 목록에 없는 키는 글자만
function linksBox(t) {
  const link = k => S.byKey[k] ? `<span><a href="#" data-open="${esc(k)}">${esc(S.byKey[k].disp || k)}</a> <small>${esc(S.byKey[k].title)}</small></span>` : `<span>${esc(k)}</span>`;
  const row = (name, keys) => keys.length ? `<div class="lk"><b>${name} ${keys.length}</b><span>${keys.map(link).join("")}</span></div>` : "";
  const html = row("언급한 이슈", t.refs || []) + row("이 이슈를 언급", S.back[t.key] || []);
  return html ? `<div class="links">${html}</div>` : "";
}
async function openTicket(part, key) {
  S.cur = { part, key };
  renderRows();
  const t = S.tickets.find(x => x.part === part && x.key === key);
  const enc = encodeURIComponent;
  const [j, pr] = await Promise.all([api(`/api/doc?kind=ticket&part=${enc(part)}&key=${enc(key)}`),
    t && t.mine ? api(`/api/prompts?key=${enc(key)}`) : Promise.resolve({ sessions: [] })]);
  $("viewer").innerHTML = `<div class="bar">${stSelect(t)}
    <input class="memo" id="memo" placeholder="메모 (선택 사유 등) — Enter 또는 칸을 벗어나면 저장" value="${esc(t.memo || "")}">
    ${/^https?:\/\//.test(t.url || "") ? `<a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(S.F.tracker_label || "이슈")} ↗</a>` : ""}</div>
    <div class="chips">${tagsOf(t).map(x => tagChip(x, S.tag && S.tag[0] === x[0] && S.tag[1] === x[1])).join("")}</div>
    ${linksBox(t)}
    ${promptsBox(pr.sessions)}
    <div class="doc">${render(j.text)}</div>`;
  viewerTop();
  const memo = $("memo");
  const saveMemo = () => { if (memo.value !== (t.memo || "")) setSelect(key, t.select, memo.value, true); };
  memo.addEventListener("keydown", e => { if (e.key === "Enter") memo.blur(); });
  memo.addEventListener("blur", saveMemo);
}
// 사용자가 이슈를 고를 때 — 내용을 그리고(좁은 창이면) 내용 화면으로 넘어간다. 선택 저장 뒤 다시 그리기는 openTicket 만 부른다
async function openTicketView(part, key) {
  await openTicket(part, key);
  const t = S.tickets.find(x => x.part === part && x.key === key);
  showViewer((t && t.disp || key) + (t && t.title ? " · " + t.title : ""));
}
async function openDoc(kind, name) {
  S.cur = null; renderRows();
  const j = await api(`/api/doc?kind=${kind}${name ? "&name=" + encodeURIComponent(name) : ""}`);
  $("viewer").innerHTML = `<div class="doc">${render(j.text)}</div>`;
  viewerTop();
}

// ---------- 선택 저장
async function setSelect(key, state, memo, fromMemo) {
  const sameKey = S.tickets.filter(t => t.key === key);
  if (fromMemo && !sameKey[0].select) {
    status("메모는 선택(발표고정·발표제외·비공개)을 먼저 지정해야 저장됩니다"); return;
  }
  memo = memo ?? (sameKey[0] ? sameKey[0].memo : "");
  try {
    await api("/api/select", { key, state, memo: state ? memo : "" });
    sameKey.forEach(t => { t.select = state; t.memo = state ? memo : ""; });
    status(`${key} → ${state || "미지정"} 저장됨`);
    renderRows();
    if (S.cur && S.cur.key === key) openTicket(S.cur.part, key);
  } catch (e) { status("저장 실패: " + e.message); }
}
function status(msg) { $("status").textContent = msg; }

// ---------- 이벤트
document.addEventListener("change", e => {
  if (e.target.matches("select.st")) setSelect(e.target.dataset.key, e.target.value);
});
document.addEventListener("click", e => {
  const chip = e.target.closest("button[data-tk]");
  if (chip) {                                         // 태그 칩 — 그 태그로 거른다(같은 칩을 다시 누르면 풀림)
    const same = S.tag && S.tag[0] === chip.dataset.tk && S.tag[1] === chip.dataset.tv;
    S.tag = same ? null : [chip.dataset.tk, chip.dataset.tv]; S.recOnly = false;
    renderRows();
    if (S.cur) openTicket(S.cur.part, S.cur.key);
    return;
  }
  if (e.target.closest("#tagOn")) { S.tag = null; return renderRows(); }
  const shop = e.target.closest("button[data-shop]");
  if (shop) { $("q").value = shop.dataset.shop; S.recOnly = false; searchBodies(); return renderRows(); }
  if (e.target.closest("#wkSend")) return sendWeekly();
  const card = e.target.closest("button.card[data-act]");
  if (card) {
    const act = card.dataset.act;
    S.recOnly = act === "rec";
    $("q").value = ""; $("fHarness").value = ""; $("fSel").value = ""; $("fOwner").value = ""; S.tag = null; searchBodies();
    $("fPart").value = act === "other" && $("fPart").value !== S.other ? S.other : act === "team" ? "team" : "mine";
    if (act === "harness") $("fHarness").value = "grilling";
    if (act === "pinned") $("fSel").value = "발표고정";
    if (act === "bot") $("fHarness").value = "bot";
    return renderRows();
  }
  const a = e.target.closest("a[data-open]");
  if (a) { e.preventDefault(); const t = S.byKey[a.dataset.open]; return openTicketView(t.part, t.key); }
  if (e.target.closest("select")) return;
  const tr = e.target.closest("#rows tr");
  if (tr) return openTicketView(tr.dataset.part, tr.dataset.key);
  const th = e.target.closest("table.tk th");
  if (th) {
    const col = th.dataset.col;
    S.sort = S.sort.col === col ? { col, dir: -S.sort.dir } : { col, dir: ["updated", "commits"].includes(col) ? -1 : 1 };
    renderRows();
  }
});
// 검색·필터를 직접 바꾸면 추천만 보기를 끈다 — 찾는 티켓이 추천 밖에 있을 수 있다
["q", "fPart", "fOwner", "fHarness", "fSel"].forEach(id => $(id).addEventListener("input", () => { S.recOnly = false; renderRows(); }));
$("q").addEventListener("input", searchBodies);
$("btnRec").onclick = () => { S.recOnly = !S.recOnly; renderRows(); };
// 한 칸 화면(좁은 창) — 목록 ↔ 내용. 내용을 열 때 history 에 한 칸 쌓아서 뒤로 가기·Esc·Alt+←·「← 목록」이 다 목록으로 돌아온다.
// 목록 스크롤 위치·필터는 그대로 둔다(목록은 감추기만 한다)
const narrowMQ = matchMedia("(max-width: 999px)");
const isDocView = () => narrowMQ.matches && document.body.classList.contains("view-doc");
function showViewer(label) {
  $("backTitle").textContent = label || "";
  if (!narrowMQ.matches || document.body.classList.contains("view-doc")) return;
  S.listY = scrollY;
  document.body.classList.add("view-doc");
  history.pushState({ aiv: 1 }, "", "#doc");
  scrollTo(0, 0);
}
function showList() {
  if (!document.body.classList.contains("view-doc")) return;
  document.body.classList.remove("view-doc");
  if (narrowMQ.matches) requestAnimationFrame(() => scrollTo(0, S.listY || 0));
}
function goList() { if (history.state && history.state.aiv) history.back(); else showList(); }
function viewerTop() {          // 내용을 새로 그렸을 때 맨 위로 — 한 칸 화면에서 목록을 보는 중이면 목록 스크롤은 건드리지 않는다
  if (!narrowMQ.matches) $("paneR").scrollTop = 0; else if (isDocView()) scrollTo(0, 0);
}
addEventListener("popstate", e => { if (e.state && e.state.aiv) { if (narrowMQ.matches) document.body.classList.add("view-doc"); } else showList(); });
narrowMQ.addEventListener("change", () => { if (!narrowMQ.matches) showList(); });
if (location.hash === "#doc") history.replaceState(null, "", location.pathname + location.search);   // 새로 고침하면 목록부터
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (isDocView() && !(e.target.closest && e.target.closest("input, textarea, select"))) goList(); }
  else if (e.altKey && e.key === "ArrowLeft" && isDocView()) { e.preventDefault(); goList(); }
});
$("btnBack").onclick = goList;
// 테마 — 자동/밝게/어둡게 순환. 고른 값은 이 브라우저에만 기억한다(저장 실패해도 화면은 정상)
const THEMES = [["auto", "◐ 자동"], ["light", "☀ 밝게"], ["dark", "☾ 어둡게"]];
function applyTheme(mode) {
  if (mode === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", mode);
  $("btnTheme").textContent = THEMES.find(t => t[0] === mode)[1];
  $("btnTheme").dataset.mode = mode;
}
(() => {
  let saved = "auto";
  try { saved = localStorage.getItem("ai-share-theme") || "auto"; } catch (e) {}
  applyTheme(THEMES.some(t => t[0] === saved) ? saved : "auto");
})();
$("btnTheme").onclick = () => {
  const i = THEMES.findIndex(t => t[0] === $("btnTheme").dataset.mode);
  const next = THEMES[(i + 1) % THEMES.length][0];
  applyTheme(next);
  try { localStorage.setItem("ai-share-theme", next); } catch (e) {}
};
// 팀 명단 편집 — config.local.json 의 ai_share 에 저장, 다음 수집부터 적용
const splitNames = v => v.split(/[,\n]/).map(x => x.trim()).filter(Boolean);
async function openTeam() {
  S.cur = null; renderRows();
  const t = await api("/api/team");
  const ali = Object.entries(t.aliases).map(([k, v]) => `${k}=${v}`).join("\n");
  $("viewer").innerHTML = `<div class="teamform">
    <h2>팀 명단</h2>
    <p class="hint">${t.tracker ? esc(t.tracker) + " 에 보이는 이름이나 아이디를" : "git 커밋 이름(author)을"} 쉼표나 줄바꿈으로 적습니다. 나는 자동으로 빠집니다.
      저장한 명단은 <b>다음 수집부터</b> 반영됩니다. 저장 위치: <code>${esc(t.file)}</code> 의 ai_share</p>
    <label>내 팀 (${esc(t.part)})<small>팀원 티켓을 함께 모아 담당자별로 봅니다</small></label>
    <textarea id="tmTeam" rows="2">${esc(t.team.join(", "))}</textarea>
    ${t.other_part ? `<label>${esc(t.other_part)} 파트 팀<small>참고 파트 사람들 — 표시용</small></label>
    <textarea id="tmOther" rows="2">${esc(t.other_team.join(", "))}</textarea>` : ""}
    <label>이름 별칭<small>git 에 개인 계정으로 커밋하는 사람 — 한 줄에 "git 이름=표시 이름"</small></label>
    <textarea id="tmAlias" rows="3" placeholder="hong-gildong=홍길동">${esc(ali)}</textarea>
    <div class="btns"><button id="tmSave">저장</button>
      <button id="tmSaveCollect" class="primary">저장하고 다시 수집</button><span class="msg" id="tmMsg"></span></div>
  </div>`;
  viewerTop();
  const save = async collectAfter => {
    const aliases = {};
    $("tmAlias").value.split("\n").map(l => l.split("=")).forEach(([k, v]) => { if (k && v && k.trim()) aliases[k.trim()] = v.trim(); });
    try {
      await api("/api/team", { team: splitNames($("tmTeam").value), other_team: $("tmOther") ? splitNames($("tmOther").value) : [], aliases });
      $("tmMsg").textContent = collectAfter ? "저장됨 — 다시 수집 중… (20초 내외)" : "저장됨 — 다음 수집부터 반영됩니다";
      if (collectAfter) { await $("btnCollect").onclick(); $("tmMsg").textContent = "저장하고 다시 수집했습니다"; }
    } catch (e) { $("tmMsg").textContent = "저장 실패: " + e.message; }
  };
  $("tmSave").onclick = () => save(false);
  $("tmSaveCollect").onclick = () => save(true);
  showViewer("팀 명단");
}
$("btnTeam").onclick = openTeam;
// 주간 업무 보고 초안 — 이번 주(월요일~오늘)를 모아 LLM 이 초안을 쓴다. 보내기는 미리 본 뒤 따로 누른다
let lastWeekly = "";
$("btnWeekly").onclick = async () => {
  const eng = S.F.weekly_engine === "ollama" ? "로컬 ollama" : "claude CLI(구독 사용량)";
  if (!confirm(`이번 주(${S.week.since} ~ ${S.week.until}) 주간 보고 초안을 만들까요?\n수집 뒤 ${eng} 를 불러 1~3분 걸립니다. 메일은 보내지 않습니다.`)) return;
  const b = $("btnWeekly"); b.disabled = true; status("주간 보고 초안 만드는 중… (1~3분)");
  S.cur = null; renderRows();
  $("viewer").innerHTML = '<div class="weekly"><h2>주간 보고 초안</h2><p class="msg">수집하고 초안을 쓰는 중입니다…</p></div>';
  viewerTop(); showViewer("주간 보고 초안");
  try {
    const j = await api("/api/weekly", { since: S.week.since, until: S.week.until });
    if (!j.ok) { $("viewer").innerHTML = `<div class="doc"><h2>주간 보고 실패</h2><pre><code>${esc(j.log)}</code></pre></div>`; status("주간 보고 실패"); }
    else {
      lastWeekly = j.name;
      $("viewer").innerHTML = `<div class="weekly"><div class="btns"><b>${esc(j.name)}</b>
        <button id="wkSend" class="primary" title="메일 설정의 받는 사람(ai_share.weekly_report.to, 비면 내 주소)에게">메일로 보내기</button>
        <span class="msg" id="wkMsg">${esc(j.why || "")}</span></div><div class="doc">${render(j.text)}</div></div>`;
      status(j.llm_ok ? "초안 완료 — 확인 후 보내기" : "LLM 실패 — 원자료로 대신 만들었습니다");
      await load();
    }
  } catch (e) { status("주간 보고 실패: " + e.message); }
  b.disabled = false;
};
async function sendWeekly() {
  if (!lastWeekly || !confirm("이 주간 보고를 메일로 보낼까요?")) return;
  try {
    const j = await api("/api/weekly/send", { name: lastWeekly, since: S.week.since, until: S.week.until });
    $("wkMsg").textContent = j.ok ? "보냈습니다 " + (j.why || "") : "못 보냄: " + (j.why || j.log || "");
  } catch (e) { $("wkMsg").textContent = "못 보냄: " + e.message; }
}
$("btnIndex").onclick = () => openDoc("index").then(() => showViewer("INDEX"));
$("report").onchange = e => {
  const v = e.target.value;
  if (!v) return;
  openDoc("report", v).then(() => {
    showViewer(v);
    if (!v.includes("주간보고")) return;
    lastWeekly = v;
    $("viewer").insertAdjacentHTML("afterbegin", `<div class="weekly" style="padding-bottom:0"><div class="btns"><b>${esc(v)}</b>
      <button id="wkSend" class="primary">메일로 보내기</button><span class="msg" id="wkMsg"></span></div></div>`);
  });
};
$("btnCollect").onclick = async () => {
  const b = $("btnCollect"); b.disabled = true; status("수집 중…");
  try {
    const j = await api("/api/collect", { since: $("since").value, until: $("until").value });
    status(j.ok ? "수집 완료" : "수집 실패 — 로그를 오른쪽에 표시");
    if (!j.ok) { $("viewer").innerHTML = `<div class="doc"><h2>수집 로그</h2><pre><code>${esc(j.log)}</code></pre></div>`; viewerTop(); showViewer("수집 로그"); }
    await load();
  } catch (e) { status("수집 실패: " + e.message); }
  b.disabled = false;
};

async function load() {
  const j = await api("/api/tickets");
  S.tickets = j.tickets; S.F = j.features || {}; S.week = j.week; S.byKey = {};
  try { S.keyRe = S.F.key_re ? new RegExp(S.F.key_re, "g") : null; } catch (e) { S.keyRe = null; }
  $("thTag").classList.toggle("hide", !S.F.tag); $("thTag").textContent = S.F.tag || "꼬리표";
  $("thHarness").classList.toggle("hide", !S.F.harness);
  $("optBot").classList.toggle("hide", !S.F.review);
  if (!S.F.harness) [...$("fHarness").options].forEach(o => { if (["grilling", "doc", "none"].includes(o.value)) o.classList.add("hide"); });
  $("fHarness").classList.toggle("hide", !S.F.harness && !S.F.review);
  $("q").placeholder = S.F.tag ? `이슈·${S.F.tag}·제목·메모 검색` : "이슈·제목·메모 검색";
  S.mine = j.mine; S.other = j.other; S.stats = j.stats || {};
  // 추천 대상 = 최근 rec_days 일(기본 14) — 발표가 1~2주 단위
  S.recDays = j.rec_days || 14;
  S.recCut = new Date(Date.parse(j.period.until) - S.recDays * 864e5).toISOString().slice(0, 10);
  j.tickets.forEach(t => { if (!S.byKey[t.key] || t.mine) S.byKey[t.key] = t; });
  S.back = {};                                    // 백링크 — 다른 이슈 문서가 이 키를 언급했나
  j.tickets.forEach(t => (t.refs || []).forEach(r => { const b = S.back[r] = S.back[r] || []; if (!b.includes(t.key)) b.push(t.key); }));
  if ($("fPart").options.length === 1) {
    $("fPart").insertAdjacentHTML("beforeend", `<option value="mine">내 것</option>` +
      `<option value="team">팀원 것 (${esc(j.mine)})</option><option value="${esc(j.mine)}">${esc(j.mine)} 전체</option>` +
      (j.other ? `<option value="${esc(j.other)}">${esc(j.other)} 파트</option>` : ""));
    $("fPart").value = "mine";                    // 처음엔 내 것만 — 팀원·다른 파트는 필터나 카드로 켠다
  }
  $("period").textContent = `${j.period.since} ~ ${j.period.until}`;
  const me = j.me || {};
  S.meNames = [me.display, me.name, ...(me.authors || [])].filter(Boolean);
  $("me").textContent = me.display || me.name ? `${me.display || me.name}` : "";
  // 담당자 필터 — 티켓 수 많은 순. 고른 값은 다시 불러와도 유지
  const cnt = {};
  j.tickets.forEach(t => (t.owner || "").split(", ").filter(Boolean).forEach(w => cnt[w] = (cnt[w] || 0) + 1));
  const keep = $("fOwner").value;
  $("fOwner").innerHTML = '<option value="">담당 전체</option>' + Object.entries(cnt).sort((a, b) => b[1] - a[1])
    .map(([w, c]) => `<option value="${esc(w)}">${esc(w)} (${c})</option>`).join("");
  $("fOwner").value = keep;
  $("since").value = $("since").value || j.period.since;
  $("until").value = $("until").value || j.period.until;
  $("report").innerHTML = '<option value="">보고·발표 자료…</option>' + j.reports.map(r => `<option>${esc(r)}</option>`).join("");
  renderRows();
}
load().catch(e => { $("viewer").innerHTML = `<div class="empty">불러오기 실패: ${esc(e.message)}<br>먼저 <b>수집</b> 을 눌러 보세요.</div>`; showViewer("불러오기 실패"); });
</script>
</body>
</html>
